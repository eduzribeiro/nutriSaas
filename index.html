<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriSaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Nova paleta do NutriSaaS:
            // Verde claro mais alegre e orgânico (sem tons cinzas/pretos)
            // Detalhes pasteis (50, 100, 200) mapeados para tons Prata Metálicos (Silver)
            emerald: {
              50: '#f8fafc', // Prata super claro (fundo de cards)
              100: '#e2e8f0', // Prata (bordas sutis e botões de atalho leve)
              200: '#cbd5e1', // Prata escuro
              300: '#86efac', // Verde maçã claro
              400: '#4ade80', // Verde brilhante
              500: '#22c55e', // Verde principal vibrante
              600: '#16a34a', // Verde de ação/botões (mais claro que o original 059669)
              700: '#15803d', // Verde escuro para hover
              800: '#166534',
              900: '#14532d',
              950: '#052e16',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>

</head>

<body class="bg-gray-50 text-slate-800">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
