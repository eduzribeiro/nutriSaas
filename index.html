<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriSaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Paleta Híbrida NutriSaaS:
            // Mantém os tons base rigorosamente originais para não quebrar rodapés e caixas de alerta dos documentos.
            // Apenas suaviza os botões e barras fortes (500, 600) para um verde sutil, premium e elegante.
            emerald: {
              50: '#ecfdf5',  // ORIGINAL TAILWIND (Garante fundo de rodapés visível)
              100: '#d1fae5', // ORIGINAL TAILWIND 
              200: '#a7f3d0', // ORIGINAL TAILWIND
              300: '#6ee7b7', // ORIGINAL TAILWIND
              400: '#5fae92', // Verde Suave
              500: '#4a997b', // Verde Elegante
              600: '#387d63', // O NOVO VERDE PRINCIPAL SUTIL (substitui o antigo #059669 fortíssimo)
              700: '#2d6852', // Verde Escuro Premium
              800: '#065f46', // ORIGINAL TAILWIND
              900: '#064e3b', // ORIGINAL TAILWIND
              950: '#022c22', // ORIGINAL TAILWIND
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>

</head>

<body class="bg-gray-50 text-slate-800">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
